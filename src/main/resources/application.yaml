  spring:
    application:
      name: renovial

    datasource:
      url: jdbc:postgresql://localhost:5432/renovial
      username: postgres
      password: password
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          show_sql: true
          format_sql: true

  logging:
    level:
      fr.renovial: DEBUG
      org.springframework.security: TRACE

  server:
    port: 8081

  application:
    security:
      jwt:
        secret: mysupersecretkeymysupersecretkey123
        expiration: 86400000

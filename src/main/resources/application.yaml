spring:
  application:
    name: renovial

  datasource:
    url: jdbc:postgresql://localhost:5432/renovial
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

server:
  port: 8081

logging:
  level:
    fr.renovial: DEBUG
    org.springframework.security: TRACE

application:
  security:
    jwt:
      secret: mysupersecretkeymysupersecretkey123
      expiration: 86400000
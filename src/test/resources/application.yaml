spring:
  application:
    name: renovial
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    fr.renovial: DEBUG

server:
  port: 8081

application:
  security:
    jwt:
      secret: mysupersecretkeymysupersecretkey123
      expiration: 86400000